<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lin</title>
<style>
:root{--cream:#FAF8F5;--white:#FFF;--blush:#F2E8E4;--rose:#C9897A;--rose-deep:#A86556;--muted:#9B8F8A;--dark:#2C2320;--border:#E8DDD9;--shadow:rgba(44,35,32,.08);--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);--header-height:calc(53px + var(--safe-top));--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:var(--cream);font-family:var(--font-sans);color:var(--dark);overflow:hidden}button,input{font:inherit}
.hdr{background:var(--white);padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:fixed;top:var(--safe-top);left:0;right:0;z-index:20;height:53px}.hdr-txt h1{font-size:18px;font-weight:650}.hdr-txt p{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.cat-wrap{display:flex;align-items:center;gap:12px}.cat{position:relative;width:30px;height:26px;transform:scale(.72)}.cat-body{width:30px;height:20px;background:var(--rose);border-radius:50%;position:absolute;bottom:0;left:0}.cat-head{width:25px;height:21px;background:var(--rose);border-radius:50%;position:absolute;top:0;left:4px}.cat-ear-l,.cat-ear-r{width:0;height:0;position:absolute;top:-6px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid var(--rose)}.cat-ear-l{left:0}.cat-ear-r{right:0}.cat-eye-l,.cat-eye-r{width:4px;height:4px;background:var(--dark);border-radius:50%;position:absolute;top:9px}.cat-eye-l{left:5px}.cat-eye-r{right:5px}.cat-nose{width:4px;height:3px;background:var(--rose-deep);border-radius:50%;position:absolute;top:14px;left:50%;transform:translateX(-50%)}.cat-tail{width:17px;height:5px;background:var(--rose);border-radius:4px;position:absolute;bottom:1px;right:-9px;transform:rotate(15deg)}.hdr-right{display:flex;align-items:center;gap:8px}.pill{display:flex;align-items:center;gap:5px;background:var(--blush);padding:5px 10px;border-radius:20px;font-size:11px;color:var(--rose-deep);font-weight:500}.dot{width:6px;height:6px;background:#5cb85c;border-radius:50%}
.pg{position:fixed;top:var(--header-height);bottom:56px;left:0;right:0;overflow-y:auto;background:var(--cream);-webkit-overflow-scrolling:touch;display:none}.pg.active{display:block}#pg-chat{padding:0;flex-direction:column}#pg-chat.active{display:flex}.chat-topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}.sidebar-btn{width:36px;height:36px;border:none;background:var(--white);color:var(--dark);font-size:18px}.chat-topbar-title{font-size:14px;font-weight:600}.cms{flex:1;overflow-y:auto;padding:16px 16px 8px;position:relative}.clabel{text-align:center;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}.tdiv{text-align:center;font-size:11px;color:var(--muted);margin:18px 0 12px}.msg{margin-bottom:14px;display:flex;flex-direction:column}.msg.grouped{margin-bottom:3px}.msg.anna{align-items:flex-end}.msg.lin{align-items:flex-start}.msg-row{display:flex;gap:6px;align-items:flex-end}.msg.anna .msg-row{flex-direction:row-reverse}.msg-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--blush);color:var(--rose-deep);border:1px solid var(--border)}.bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap}.msg.lin .bub{background:var(--white);color:var(--dark);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:0 1px 6px var(--shadow)}.msg.anna .bub{background:var(--rose);color:white;border-bottom-right-radius:4px}.mtime2{font-size:10px;color:var(--muted);margin-top:3px}.ciw{padding:10px 16px calc(10px + var(--safe-bottom));background:var(--white);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}.ci{flex:1;border:1.5px solid var(--border);border-radius:22px;padding:9px 16px;font-size:14px;background:var(--cream);outline:none;color:var(--dark)}.sb{width:38px;height:38px;background:var(--rose);border:none;border-radius:50%;cursor:pointer;font-size:16px;color:white;flex-shrink:0}.sb.attach{background:var(--blush);color:var(--rose-deep)}
/* ChatNest trace-row adaptation: live phase, retained history, inline timeline. */.assistant-segment{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:14px}.assistant-segment .bub{max-width:78%}.segment-streaming .bub::after{content:' ';display:inline-block;width:5px;height:14px;margin-left:3px;vertical-align:-2px;background:var(--rose);opacity:.7;animation:blink 1s steps(2,end) infinite}.timeline-agent{width:100%;padding-left:32px;margin:-5px 0 8px}.timeline-agent .agent-trace{max-width:78%}.timeline-agent .agent-live-row{font-size:14px;padding:7px 10px}.timeline-agent .agent-history{font-size:14px}.timeline-agent .agent-history-body{font-size:12px}.timeline-agent .trace-row{font-size:12px}.timeline-agent .trace-detail{font-size:11px}.agent-trace{max-width:78%;font-size:12px;line-height:1.5}.agent-live-row{display:flex;align-items:center;gap:7px;padding:7px 10px;color:var(--muted);font-size:12px}.agent-live-row .agent-mark{color:var(--rose-deep);font-size:14px}.agent-live-row .agent-current{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agent-live-row .spinner{width:10px;height:10px;border:1.5px solid #dec6be;border-top-color:var(--rose-deep);border-radius:50%;animation:spin .8s linear infinite;flex:none}.agent-trail{display:flex;flex-direction:column;gap:3px;padding:2px 10px 7px;color:var(--muted);font-size:10px}.agent-trail-row{display:flex;align-items:center;gap:7px}.agent-trail-row .done{color:#6e9c77}.agent-history{border:1px solid var(--border);border-radius:8px;background:var(--blush);overflow:hidden}.agent-history-header{width:100%;display:flex;align-items:center;gap:7px;padding:8px 10px;border:0;background:transparent;color:var(--dark);cursor:pointer;text-align:left}.agent-history-header .mark{color:var(--rose-deep);font-size:14px}.agent-history-header .summary{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-history-header .count{font-size:10px;color:var(--muted)}.agent-history-header .chevron{font-size:17px;line-height:12px;color:var(--muted);transition:transform .2s}.agent-history.expanded .chevron{transform:rotate(180deg)}.agent-history-body{display:none;padding:5px 10px 7px;border-top:1px solid rgba(168,101,86,.16)}.agent-history.expanded .agent-history-body{display:block}.trace-row{display:flex;align-items:center;gap:7px;padding:6px 0;border-bottom:1px solid rgba(168,101,86,.12);color:var(--muted);font-size:11px;cursor:pointer}.trace-row:last-child{border-bottom:0}.trace-row .trace-icon{width:16px;text-align:center;color:var(--rose-deep)}.trace-row.complete .trace-icon{color:#6e9c77}.trace-row .trace-label{flex:1}.trace-row .trace-state{font-size:10px}.trace-detail{display:none;padding:0 0 5px 23px;color:var(--muted);font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.trace-row.show-detail + .trace-detail{display:block}/* Prototype-only controls are deliberately above Lin's tab bar. */.prototype-controls{position:fixed;left:10px;right:10px;bottom:66px;z-index:30;display:flex;gap:6px;align-items:center;pointer-events:auto}.prototype-controls button{border:1px solid var(--border);border-radius:8px;background:var(--white);color:var(--rose-deep);padding:7px 9px;font-size:11px;cursor:pointer}.prototype-controls button:disabled{opacity:.45}.control-status{margin-left:auto;padding:6px 8px;border-radius:8px;background:var(--blush);color:var(--muted);font-size:10px}
</style>
</head>
<body>
<header class="hdr"><div class="cat-wrap"><div class="cat"><div class="cat-head"><div class="cat-ear-l"></div><div class="cat-ear-r"></div><div class="cat-eye-l"></div><div class="cat-eye-r"></div><div class="cat-nose"></div></div><div class="cat-body"><div class="cat-tail"></div></div></div><div class="hdr-txt"><h1>Lin</h1><p>正在看著妳</p></div></div><div class="hdr-right"><div class="pill"><span class="dot"></span>online</div></div></header>
<div class="pg active" id="pg-chat"><div class="chat-topbar"><button class="sidebar-btn" aria-label="打开聊天列表">☰</button><div class="chat-topbar-title">新对话</div></div><div class="cms" id="cm"><div class="clabel">with Lin</div><div class="tdiv">今天 10:24</div><div class="msg anna"><div class="msg-row"><div class="msg-avatar">🙂</div><div class="bub">帮我查一下今天 AI 新闻。</div></div><div class="mtime2">10:24</div></div><div class="msg lin"><div class="msg-row"><div class="msg-avatar">🐈</div><div class="bub">我去查一下。</div></div><div class="mtime2">10:24</div></div></div><form class="ciw" id="composer"><button class="sb attach" type="button" aria-label="添加附件">📎</button><input class="ci" id="input" placeholder="跟主人說話..." autocomplete="off"><button class="sb" type="submit" aria-label="发送">↑</button></form></div>
<nav class="tab-bar"><button class="tb" type="button"><span class="ti">🏠</span>Home</button><button class="tb active" type="button"><span class="ti">💬</span>Chat</button><button class="tb" type="button"><span class="ti">🧠</span>Memory</button><button class="tb" type="button"><span class="ti">◌</span>Life</button><button class="tb" type="button"><span class="ti">👥</span>Workgroup</button><button class="tb" type="button"><span class="ti">🌙</span>Mine</button></nav>
<div class="prototype-controls" aria-label="Prototype 演示控制"><button id="playBtn" type="button">▶ 播放</button><button id="resetBtn" type="button">↺ 重置</button><span class="control-status" id="status">普通聊天</span></div>
<script>
const $=id=>document.getElementById(id),cm=$('cm'),status=$('status'),playBtn=$('playBtn'),resetBtn=$('resetBtn');
const AGENT_MARK='✦';
const initial=cm.innerHTML;let playing=false,toolCount=0,activeAgent=null;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function scroll(){cm.scrollTop=cm.scrollHeight}function setStatus(text){status.textContent=text}
function addMessage(role,text){const row=document.createElement('div');row.className='msg '+role;row.innerHTML='<div class="msg-row"><div class="msg-avatar">'+(role==='anna'?'🙂':'🐈')+'</div><div class="bub"></div></div><div class="mtime2">10:24</div>';row.querySelector('.bub').textContent=text;cm.append(row);scroll()}
function newSegment(){const row=document.createElement('div');row.className='msg lin assistant-segment segment-streaming';row.innerHTML='<div class="msg-row"><div class="msg-avatar">🐈</div><div class="bub"></div></div><div class="mtime2">10:24</div>';cm.append(row);scroll();return {row,bubble:row.querySelector('.bub'),text:''}}
async function stream(segment,text){for(const char of text){segment.text+=char;segment.bubble.textContent=segment.text;scroll();await wait(42)}segment.row.classList.remove('segment-streaming')}
function addTraceRow(body,event){const row=document.createElement('div');const type=event.type;row.className='trace-row '+(type==='tool.complete'?'complete':'');row.innerHTML='<span class="trace-icon">'+(type==='tool.complete'?'✓':type==='tool.progress'?'·':type==='tool.start'?'⌕':'·')+'</span><span class="trace-label"></span><span class="trace-state"></span>';row.querySelector('.trace-label').textContent=type==='thinking.delta'?'Thinking':event.name||type;row.querySelector('.trace-state').textContent=type==='tool.complete'?'完成':type==='tool.progress'?'Progress':type==='tool.start'?'Started':'';const detail=document.createElement('pre');detail.className='trace-detail';detail.textContent=event.preview||event.summary||event.context||event.text||'';row.onclick=()=>row.classList.toggle('show-detail');body.append(row,detail)}
function newAgent(){const slot=document.createElement('div');slot.className='timeline-agent';slot.innerHTML='<div class="agent-trace"><div class="agent-live-row"><span class="agent-mark"></span><span class="agent-current">正在使用 Hermes</span><span class="spinner"></span></div><div class="agent-trail"></div></div>';slot.querySelector('.agent-mark').textContent=AGENT_MARK;cm.append(slot);activeAgent={slot,events:[]};scroll();return activeAgent}
function agentEvent(event,label){if(!activeAgent)newAgent();activeAgent.events.push(event);activeAgent.slot.querySelector('.agent-current').textContent=label;setStatus(label);scroll()}
function completeAgent(){const agent=activeAgent;if(!agent)return;const history=document.createElement('div');history.className='agent-history';history.innerHTML='<button type="button" class="agent-history-header" aria-expanded="false"><span class="mark"></span><strong>Agent</strong><span class="summary"></span><span class="count"></span><span class="chevron">⌄</span></button><div class="agent-history-body"></div>';const header=history.querySelector('.agent-history-header');header.querySelector('.mark').textContent=AGENT_MARK;header.querySelector('.summary').textContent='搜索网页';header.querySelector('.count').textContent=agent.events.filter(e=>e.type==='tool.complete').length+' Tool';agent.events.forEach(e=>addTraceRow(history.querySelector('.agent-history-body'),e));header.onclick=()=>{const open=history.classList.toggle('expanded');header.setAttribute('aria-expanded',String(open))};agent.slot.querySelector('.agent-trace').replaceWith(history);activeAgent=null;scroll()}
async function run(){if(playing)return;playing=true;playBtn.disabled=true;resetBtn.disabled=true;let a=newSegment();await stream(a,'我先帮你看看这个问题，我需要确认一下。');newAgent();agentEvent({type:'thinking.delta',text:'选择搜索方式'},'正在搜索');await wait(420);agentEvent({type:'tool.start',tool_id:'search-1',name:'web_search',context:'查找 AI 新闻'},'正在搜索');await wait(520);agentEvent({type:'tool.progress',tool_id:'search-1',name:'web_search',preview:'正在读取搜索结果'},'正在搜索');await wait(520);agentEvent({type:'tool.complete',tool_id:'search-1',name:'web_search',summary:'搜索完成'},'搜索网页');completeAgent();a=newSegment();await stream(a,'我找到相关资料了，不过还要再确认一次。');newAgent();agentEvent({type:'thinking.delta',text:'检查结果一致性'},'正在搜索');await wait(380);agentEvent({type:'tool.start',tool_id:'search-2',name:'web_search',context:'确认最新结果'},'正在搜索');await wait(520);agentEvent({type:'tool.progress',tool_id:'search-2',name:'web_search',preview:'正在读取最新结果'},'正在搜索');await wait(520);agentEvent({type:'tool.complete',tool_id:'search-2',name:'web_search',summary:'搜索完成'},'搜索网页');completeAgent();a=newSegment();await stream(a,'我重新确认过了，下面是整理后的重点。');setStatus('普通聊天');playing=false;playBtn.disabled=false;resetBtn.disabled=false}
function reset(){playing=false;toolCount=0;activeAgent=null;cm.innerHTML=initial;playBtn.disabled=false;resetBtn.disabled=false;setStatus('普通聊天');scroll()}
playBtn.onclick=run;resetBtn.onclick=reset;$('composer').onsubmit=e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;addMessage('anna',text);$('input').value='';setStatus('普通聊天')};scroll();
</script></body></html>
