<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UI Agent Developer Console</title>
  <link rel="stylesheet" href="/static/developer.css">
</head>
<body>
  <main class="console-shell">
    <header class="console-header">
      <div>
        <div class="eyebrow">UI Agent</div>
        <h1>Developer Console</h1>
      </div>
      <div class="header-actions">
        <span id="connection-badge" class="status-badge live">LIVE</span>
        <button id="clear-log" class="icon-button" title="Clear log" aria-label="Clear log">×</button>
      </div>
    </header>

    <section class="stream-toolbar" aria-label="Streaming controls">
      <span id="stream-state">Waiting for SSE</span>
      <div class="toolbar-actions">
        <button id="pause-scroll" class="toolbar-button">Pause Scroll</button>
        <button id="resume-scroll" class="toolbar-button" disabled>Resume</button>
      </div>
    </section>

    <div id="console-sections" class="console-sections"></div>
  </main>
  <script src="/static/js/dev_panel.js"></script>
  <script src="/static/js/developer_console.js"></script>
</body>
</html>
